<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino Drako</title>
<style>
:root{--red:#e10600;--bg:#000;--dim:#3a3a3a;--green:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--red);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto 24px}
.logo{width:56px;height:56px}
.btn{background:transparent;color:var(--red);border:2px solid var(--red);border-radius:10px;padding:10px 18px;font-size:16px;font-weight:bold;cursor:pointer;text-transform:uppercase}
.btn:hover{background:var(--red);color:#000}
.wrap{max-width:560px;margin:0 auto}
h1{text-align:center;font-size:26px;margin:0 0 6px;text-transform:uppercase;letter-spacing:2px}
.sub{text-align:center;color:#a00;margin-bottom:20px;font-size:14px}
table{width:100%;border-collapse:collapse;border:2px solid var(--red)}
td{border:1px solid #600;padding:14px 12px;font-size:17px;font-weight:bold}
td.ck{width:70px;text-align:center}
.chk{background:none;border:none;cursor:pointer;padding:4px}
.chk svg{width:36px;height:36px;stroke:var(--dim);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.chk.on svg{stroke:var(--green);filter:drop-shadow(0 0 6px var(--green))}
.screen{display:none;max-width:560px;margin:60px auto 0;text-align:center}
.screen.show{display:block}
.screen h2{font-size:30px;text-transform:uppercase;margin:20px 0 30px}
.screen .btn{font-size:18px;padding:14px 28px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:#000;border:2px solid var(--red);border-radius:14px;padding:26px;text-align:center;max-width:340px;width:100%}
.box p{font-size:20px;margin:0 0 20px;line-height:1.4}
</style>
</head>
<body>
<div class="top">
  <svg class="logo" viewBox="0 0 64 64" aria-label="Logo halter">
    <g fill="#e10600">
      <rect x="4" y="24" width="6" height="16" rx="2"/>
      <rect x="11" y="16" width="9" height="32" rx="2"/>
      <rect x="20" y="29" width="24" height="6"/>
      <rect x="44" y="16" width="9" height="32" rx="2"/>
      <rect x="54" y="24" width="6" height="16" rx="2"/>
    </g>
  </svg>
  <button class="btn" id="btnMeses">Meses</button>
</div>

<div class="wrap" id="main">
  <h1>Treino Drako</h1>
  <div class="sub" id="semana"></div>
  <table id="tabela"></table>
</div>

<div class="screen" id="semanaOk">
  <h2>Parabéns, mais uma semana completa!</h2>
  <button class="btn" id="btnProx">Próxima semana</button>
</div>

<div class="screen" id="mesOk">
  <h2>Parabéns, mais uma meta cumprida!</h2>
  <button class="btn" id="btnMes">Bora para o próximo mês</button>
</div>

<div class="modal" id="modal">
  <div class="box">
    <p id="modalTxt"></p>
    <button class="btn" id="fechar">Fechar</button>
  </div>
</div>

<script>
var DIAS=["segunda","terça","quarta","quinta","sexta"];
var KEY="treinoDrakeV1";
var DAY=86400000;
var S;
function load(){
  try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return;}}catch(e){}
  S={checks:[false,false,false,false,false],semana:1,mesesCompletos:0,inicio:Date.now()};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function dias(){return Math.floor((Date.now()-S.inicio)/DAY);}
function show(id){
  ["main","semanaOk","mesOk"].forEach(function(x){
    var el=document.getElementById(x);
    if(x==="main"){el.style.display=(x===id)?"block":"none";}
    else{el.classList.toggle("show",x===id);}
  });
}
function render(){
  document.getElementById("semana").textContent="Semana "+S.semana+" · Mês "+(S.mesesCompletos+1);
  var t=document.getElementById("tabela");t.innerHTML="";
  DIAS.forEach(function(d,i){
    var tr=document.createElement("tr");
    var td=document.createElement("td");td.textContent="Treino de "+d+" — tópico "+(i+1);
    var tc=document.createElement("td");tc.className="ck";
    var b=document.createElement("button");b.className="chk"+(S.checks[i]?" on":"");
    b.setAttribute("aria-label","Marcar treino de "+d);
    b.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.5 3.5L17 9"/></svg>';
    b.onclick=function(){S.checks[i]=!S.checks[i];save();render();
      if(S.checks.every(Boolean)){setTimeout(function(){show("semanaOk");},400);}
    };
    tc.appendChild(b);tr.appendChild(td);tr.appendChild(tc);t.appendChild(tr);
  });
}
document.getElementById("btnProx").onclick=function(){
  S.checks=[false,false,false,false,false];S.semana++;save();
  if(dias()>=30){show("mesOk");}else{render();show("main");}
};
document.getElementById("btnMes").onclick=function(){
  S.mesesCompletos++;S.inicio=Date.now();S.semana=1;S.checks=[false,false,false,false,false];save();
  render();show("main");
};
document.getElementById("btnMeses").onclick=function(){
  var n=S.mesesCompletos;
  var txt="Meses completos: "+n+"\nTempo treinando: "+(n*30+dias())+" dias";
  document.getElementById("modalTxt").innerHTML=txt.replace("\n","<br>");
  document.getElementById("modal").classList.add("show");
};
document.getElementById("fechar").onclick=function(){document.getElementById("modal").classList.remove("show");};
load();render();
if(dias()>=30){show("mesOk");}
else if(S.checks.every(Boolean)){show("semanaOk");}
else{show("main");}
</script>
</body>
</html>
